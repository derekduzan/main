<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Derek Duzan</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='white'%3EDD%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..0,800;1,300..0,800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, .74);
      --card-bg: #1e293b;
      --line: rgba(255, 255, 255, .18);
      
      /* Vibrant Accent Design Tokens */
      --accent-pink: #f472b6;
      --accent-cyan: #22d3ee;
      --btn-label-bg: #0f172a;
      
      --glow-cyan: rgba(34, 211, 238, 0.4);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: #05070c;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Ambient Gradient Canvas */
    body::before {
      content: '';
      position: absolute;
      top: -20%; left: -20%;
      width: 140%; height: 140%;
      background:
        radial-gradient(circle at 15% 15%, #1e1b4b, transparent 45%),
        radial-gradient(circle at 85% 85%, #0f172a, transparent 50%),
        radial-gradient(circle at 50% 25%, #111827, transparent 40%);
      opacity: 0.95;
      z-index: -1;
      will-change: transform;
      pointer-events: none;
    }

    /* Premium SVG Noise Overlay Texture */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 5;
    }

    .card {
      width: min(100%, 340px);
      padding: 32px 24px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: var(--card-bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
    }

    .card::before {
      content: '';
      position: absolute;
      width: 140px; height: 140px;
      top: -50px; right: -40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.01);
      pointer-events: none;
    }

    .card > * { position: relative; z-index: 1; }

    .profile-photo {
      width: 112px; height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 20px var(--glow-cyan);
      margin: 0 auto 20px;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: -.03em;
      font-weight: 800;
      text-transform: uppercase;
    }

    .handle {
      margin: 6px 0 12px;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 500;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .06em;
      line-height: 1.4;
    }

    /* Refactored High-Performance Interactive Button System */
    .btn {
      display: flex;
      width: 100%;
      height: 50px;
      margin-top: 14px;
      text-decoration: none;
      font-weight: 800;
      font-size: .85rem;
      border-radius: 99px;
      overflow: hidden;
      border: 2px solid var(--accent-pink);
      background: transparent;
      padding: 0;
      cursor: pointer;
      position: relative;
      transform: translateZ(0);
      will-change: transform;
      transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.015);
      box-shadow: 0 8px 20px rgba(244, 114, 182, 0.25);
    }

    /* Left-aligned readable action labels */
    .btn-label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 24px;
      color: #000000;
      background: #ffffff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 2;
    }

    /* Accent tracking marquee right side panel */
    .btn-marquee {
      width: 110px;
      background: var(--btn-label-bg);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--line);
      z-index: 2;
    }

    .marquee-text {
      color: var(--accent-pink);
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
      padding-right: 24px;
      display: inline-block;
      animation: marqueeRun 5s linear infinite;
      will-change: transform;
    }

    @keyframes marqueeRun {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* Universal Interactive Drawer Structural Framework */
    .drawer-container {
      width: 100%;
      margin-top: 14px;
      perspective: 1200px;
    }

    .drawer-flipper {
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      position: relative;
      width: 100%;
    }

    .drawer-container.flipped .drawer-flipper {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-front {
      position: relative;
      z-index: 2;
    }

    .flip-back {
      transform: rotateY(180deg);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--line);
      padding: 36px 16px 20px;
      text-align: left;
      visibility: hidden;
      z-index: 1;
    }

    .drawer-container.flipped .flip-front {
      position: absolute;
      top: 0; left: 0;
      visibility: hidden;
    }

    .drawer-container.flipped .flip-back {
      position: relative;
      visibility: visible;
      z-index: 2;
    }

    #bookingContainer .flip-back {
      padding: 36px 0 0; 
      overflow: hidden;
    }

    .calendly-wrapper {
      width: 100%;
      height: 380px; 
      background: #ffffff;
      border-radius: 0 0 22px 22px;
    }

    .close-drawer-btn {
      position: absolute;
      top: 10px; right: 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.15s ease, background-color 0.15s ease;
      z-index: 10;
    }

    .close-drawer-btn:hover {
      color: var(--text);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .close-drawer-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Forms Elements Styling */
    .form-row {
      margin-bottom: 12px;
      label {
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: .68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .05em;
      }
      input, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.25);
        color: var(--text);
        font: inherit;
        font-size: .9rem;
        &:focus { outline: none; border-color: var(--accent-cyan); }
      }
      textarea { resize: vertical; min-height: 75px; }
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 99px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .visually-hidden-honeypot {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
    }

    /* Social Layout Row Element Objects */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
    }

    .social-icon {
      width: 44px; height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--accent-cyan);
      border-radius: 50%;
      color: #fff;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 5px var(--glow-cyan);

      &:hover {
        transform: scale(1.1) translateY(-2px);
        background: var(--accent-cyan);
        color: #000;
        box-shadow: 0 0 15px var(--glow-cyan);
      }

      svg { width: 20px; height: 20px; fill: currentColor; }
    }

    .footer {
      margin: 28px 0 0;
      color: var(--accent-pink);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    @media (max-width: 480px) {
      .card { width: 100%; padding: 28px 20px; }
    }
  </style>
</head>

<body>
  <main class="card" aria-label="Derek Duzan profile links">
    
    <img src="assets/profile.jpg" class="profile-photo" alt="Derek Duzan profile photo" />

    <h1>DEREK DUZAN</h1>
    <p class="handle">@derekduzan</p>
    <p class="subtitle">Futuristic · Strategic · Connectedness · Ideation · Activator</p>

    <div class="drawer-container" id="contactContainer">
      <div class="drawer-flipper">
        <div class="flip-front">
          <button class="btn" type="button">
            <span class="btn-label">CONTACT ME</span>
            <span class="btn-marquee">
              <span class="marquee-text">MESSAGE ME MESSAGE ME</span>
              <span class="marquee-text">MESSAGE ME MESSAGE ME</span>
            </span>
          </button>
        </div>
        <div class="flip-back">
          <button class="close-drawer-btn" id="closeContactBtn" type="button" aria-label="Close Contact Frame">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
          <form id="contactForm" action="https://script.google.com/macros/s/AKfycbwWP5xsMSsj2-BTMS-pzxnvsPkmjoWfFV3m4eAesRa1wW6CkYBn4kZMR1qqf1wCNGtpww/exec" method="POST">
            <div class="form-row">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" name="firstName" autocomplete="given-name" required />
            </div>
            <div class="form-row">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" name="lastName" autocomplete="family-name" required />
            </div>
            <div class="form-row">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" autocomplete="email" required />
            </div>
            <div class="form-row">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="3" required></textarea>
            </div>
            <div class="visually-hidden-honeypot" aria-hidden="true">
              <input type="text" id="honeypot" name="honeypot" tabindex="-1" autocomplete="off" />
            </div>
            <button class="submit-btn" type="submit" id="submitBtn">Send Message</button>
          </form>
        </div>
      </div>
    </div>

    <a class="btn" href="https://www.derekduzan.com/">
      <span class="btn-label">VISIT WEBSITE</span>
      <span class="btn-marquee">
        <span class="marquee-text">GO TO DOT COM</span>
        <span class="marquee-text">GO TO DOT COM</span>
      </span>
    </a>

    <div class="drawer-container" id="bookingContainer">
      <div class="drawer-flipper">
        <div class="flip-front">
          <button class="btn" type="button">
            <span class="btn-label">BOOK A CALL</span>
            <span class="btn-marquee">
              <span class="marquee-text">VIRTUAL MEETING</span>
              <span class="marquee-text">VIRTUAL MEETING</span>
            </span>
          </button>
        </div>
        <div class="flip-back">
          <button class="close-drawer-btn" id="closeBookingBtn" type="button" aria-label="Close Scheduler Frame">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
          <div class="calendly-wrapper">
            <iframe src="https://calendly.com/derekduzan?embed_domain=derekduzan.com&embed_type=inline" width="100%" height="100%" frameborder="0"></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="social-row" aria-label="Social links">
      <a class="social-icon" href="https://www.linkedin.com/" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.9 8.6H3.8V20h3.1V8.6ZM5.4 3.8a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6ZM20.2 13.1c0-3.2-1.7-4.7-4-4.7a3.5 3.5 0 0 0-3.2 1.8V8.6h-3.1V20H13v-6c0-1.6.3-3.2 2.3-3.2s2 1.9 2 3.3V20h3.1v-6.9Z"/></svg>
      </a>
      <a class="social-icon" href="https://www.instagram.com/" aria-label="Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Zm5.25-3a1.25 1.25 0 1 1-1.25 1.25A1.25 1.25 0 0 1 17.25 6.5Z"/></svg>
      </a>
      <a class="social-icon" href="https://www.facebook.com/" aria-label="Facebook" title="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-8.2h2.8l.4-3.2h-3.2V8.5c0-.9.3-1.6 1.6-1.6H17V4.1c-.4-.1-1.4-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.5H8v3.2h2.6V22h2.9Z"/></svg>
      </a>
      <a class="social-icon" href="https://www.x.com/" aria-label="X" title="X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 3H21l-4.6 5.2L22 21h-4.4l-3.5-4.8L9.8 21H7.7l5-5.7L2 3h4.5l3.1 4.3L13.4 3h5.5Zm-1.5 16h1.2L7.2 4.9H6l11.4 14.1Z"/></svg>
      </a>
    </div>

    <p class="footer">DEREKDUZAN.COM</p>
  </main>

  <script>
    // 1. Double Drawer Functional Operations Logic System
    const contactContainer = document.getElementById('contactContainer');
    const bookingContainer = document.getElementById('bookingContainer');

    const openContactBtn = contactContainer.querySelector('.flip-front button');
    const closeContactBtn = document.getElementById('closeContactBtn');

    const openBookingBtn = bookingContainer.querySelector('.flip-front button');
    const closeBookingBtn = document.getElementById('closeBookingBtn');

    // Drawer Opening/Closing Management Sequences
    openContactBtn.addEventListener('click', () => {
      bookingContainer.classList.remove('flipped'); 
      contactContainer.classList.add('flipped');
      setTimeout(() => document.getElementById('firstName').focus(), 300);
    });

    closeContactBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      contactContainer.classList.remove('flipped');
    });

    openBookingBtn.addEventListener('click', () => {
      contactContainer.classList.remove('flipped'); 
      bookingContainer.classList.add('flipped');
    });

    closeBookingBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      bookingContainer.classList.remove('flipped');
    });

    // Close active element triggers cleanly on target context blur events
    document.addEventListener('click', (e) => {
      if (contactContainer.classList.contains('flipped') && !contactContainer.contains(e.target)) {
        contactContainer.classList.remove('flipped');
      }
      if (bookingContainer.classList.contains('flipped') && !bookingContainer.contains(e.target)) {
        bookingContainer.classList.remove('flipped');
      }
    });

    // 2. High-Performance Text-Safe Parallax Engine Pipeline via CSS Custom Variables
    const bgElement = document.body;
    document.addEventListener('mousemove', (e) => {
      const xPercent = (e.clientX / window.innerWidth) - 0.5;
      const yPercent = (e.clientY / window.innerHeight) - 0.5;
      
      bgElement.style.setProperty('--bg-x', `${xPercent * 30}px`);
      bgElement.style.setProperty('--bg-y', `${yPercent * 30}px`);
    });

    // 3. Contact Form Submission Interface Pipe
    const contactForm = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const flipBack = contactContainer.querySelector('.flip-back');

    contactForm.addEventListener('submit', (e) => {
      e.preventDefault(); 
      if (document.getElementById('honeypot').value !== '') return;
      
      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;

      const formData = new FormData(contactForm);
      const messageBox = document.getElementById('message');
      formData.set('message', messageBox.value);

      fetch(contactForm.action, {
        method: 'POST',
        body: formData,
        mode: 'no-cors' 
      })
      .then(() => {
        flipBack.innerHTML = "<h3 style='text-align:center; font-size:.9rem; color:#fff; padding-top: 55px; font-weight:700;'>MESSAGE RECEIVED.</h3>";
        setTimeout(() => {
          contactContainer.classList.remove('flipped');
        }, 2000);
      })
      .catch(err => {
        console.error(err);
        submitBtn.textContent = 'Error. Try Again';
        submitBtn.disabled = false;
      });
    });
  </script>
  
  <style>
    /* Injects motion calculations cleanly down context paths using GPU matrix transformations */
    body::before {
      transform: translate3d(var(--bg-x, 0px), var(--bg-y, 0px), 0);
    }
  </style>
</body>
</html>
