<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Derek Duzan</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='white'%3EDD%3C/text%3E%3C/svg%3E" />

<style>
:root {
  --text: #f8fafc;
  --muted: rgba(248, 250, 252, .74);
  --muted-soft: rgba(248, 250, 252, .62);
  --card: rgba(15, 23, 42, .34);
  --line: rgba(255, 255, 255, .18);
  --button: rgba(255, 255, 255, .14);
  --button-hover: rgba(255, 255, 255, .22);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color: var(--text);
  background:
    linear-gradient(rgba(2, 6, 23, .42), rgba(2, 6, 23, .60)),
    url('assets/background.jpg') center / cover no-repeat fixed;
}

.card {
  width: min(100%, 324px);
  padding: 24px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, .24);
  border-radius: 26px;
  background: var(--card);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  box-shadow: 0 22px 64px rgba(0, 0, 0, .30);
}

.logo {
  width: 104px;
  height: 104px;
  display: block;
  margin: 0 auto 16px;
  object-fit: cover;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .5);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .28);
}

h1 {
  margin: 0;
  font-size: 1.5rem;
  line-height: 1.1;
  letter-spacing: -.03em;
  font-weight: 750;
}

.handle {
  margin: 7px 0 6px;
  color: var(--muted);
  font-size: .94rem;
}

.subtitle {
  margin: 0 0 18px;
  color: var(--muted-soft);
  font-size: .82rem;
  letter-spacing: .04em;
}

.btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--button);
  color: var(--text);
  text-decoration: none;
  font-weight: 620;
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}

.btn:hover {
  transform: translateY(-1px);
  background: var(--button-hover);
  border-color: rgba(255, 255, 255, .34);
}

.btn:focus-visible,
.social-icon:focus-visible,
.form-row input:focus-visible,
.form-row textarea:focus-visible {
  outline: 3px solid rgba(255, 255, 255, .55);
  outline-offset: 3px;
}

/* Expandable contact button/form */
.contact-box {
  width: 100%;
  margin-top: 10px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: var(--button);
  overflow: hidden;
  transition: background .18s ease, border-color .18s ease;
}

.contact-box:hover {
  background: var(--button-hover);
  border-color: rgba(255, 255, 255, .34);
}

.contact-box.open {
  border-radius: 24px;
  background: var(--button-hover);
}

.contact-toggle {
  margin-top: 0;
  border: 0;
  background: transparent;
  border-radius: 0;
}

.contact-toggle:hover {
  transform: none;
  background: transparent;
  border-color: transparent;
}

.contact-fields {
  padding: 0 14px 14px;
  text-align: left;
  animation: expandIn .22s ease;
}

.contact-fields form {
  padding-top: 2px;
}

.form-row {
  margin-bottom: 10px;
}

.form-row label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: .76rem;
  font-weight: 650;
  letter-spacing: .03em;
}

.form-row input,
.form-row textarea {
  width: 100%;
  padding: 10px 11px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, .08);
  color: var(--text);
  font: inherit;
}

.form-row textarea {
  resize: vertical;
  min-height: 82px;
}

.form-row input:focus,
.form-row textarea:focus {
  border-color: rgba(255, 255, 255, .48);
  background: rgba(255, 255, 255, .11);
  outline: none;
}

.submit-btn {
  margin-top: 4px;
  background: rgba(255, 255, 255, .12);
}

.social-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
}

.social-icon {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--button);
  color: var(--text);
  text-decoration: none;
  transition: transform .18s ease, background .18s ease;
}

.social-icon:hover {
  transform: translateY(-1px);
  background: var(--button-hover);
}

.social-icon svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.footer {
  margin: 17px 0 0;
  color: var(--muted-soft);
  font-size: .72rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}

@keyframes expandIn {
  from {
    opacity: 0;
    transform: translateY(-3px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 420px) {
  body {
    padding: 16px;
    background-attachment: scroll;
  }

  .card {
    padding: 22px;
  }
}

@media (max-width: 480px) {
  .card {
    width: min(100%, 340px);
    padding: 24px 20px;
    border-radius: 24px;
  }

  .logo {
    width: 96px;
    height: 96px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 1.42rem;
  }

  .handle {
    font-size: .9rem;
  }

  .subtitle {
    font-size: .78rem;
    margin-bottom: 16px;
  }

  .btn {
    padding: 10px 13px;
    font-size: .95rem;
  }

  .social-icon {
    width: 38px;
    height: 38px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
</style>
</head>

<body>
  <main class="card" aria-label="Derek Duzan profile links">
    <img src="assets/profile.jpg" class="logo" alt="Derek Duzan profile photo" />

    <h1>Derek Duzan</h1>
    <p class="handle">@derekduzan</p>
    <p class="subtitle">Futuristic · Strategic · Connectedness · Ideation · Activator</p>

    <div class="contact-box">
      <button class="btn contact-toggle" type="button" aria-expanded="false" aria-controls="contactFields">
        Contact Me
      </button>

      <div id="contactFields" class="contact-fields" hidden>
        <form action="https://script.google.com/macros/s/AKfycbwWP5xsMSsj2-BTMS-pzxnvsPkmjoWfFV3m4eAesRa1wW6CkYBn4kZMR1qqf1wCNGtpww/exec" method="POST">
          <div class="form-row">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>

          <div class="form-row">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required />
          </div>

          <div class="form-row">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-row">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required />
          </div>

          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="3" required></textarea>
          </div>

          <button class="btn submit-btn" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <a class="btn" href="https://www.derekduzan.com/">Visit Website</a>
    <a class="btn" href="https://calendly.com/derekduzan">Book a Call</a>

    <div class="social-row" aria-label="Social links">
      <a class="social-icon" href="https://www.linkedin.com/" aria-label="LinkedIn" title="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.9 8.6H3.8V20h3.1V8.6ZM5.4 3.8a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6ZM20.2 13.1c0-3.2-1.7-4.7-4-4.7a3.5 3.5 0 0 0-3.2 1.8V8.6h-3.1V20H13v-6c0-1.6.3-3.2 2.3-3.2s2 1.9 2 3.3V20h3.1v-6.9Z"/>
        </svg>
      </a>

      <a class="social-icon" href="https://www.instagram.com/derekduzan" aria-label="Instagram" title="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5Zm5.25-3a1.25 1.25 0 1 1-1.25 1.25A1.25 1.25 0 0 1 17.25 6.5Z"/>
        </svg>
      </a>

      <a class="social-icon" href="https://www.facebook.com/derekduzan" aria-label="Facebook" title="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.5 22v-8.2h2.8l.4-3.2h-3.2V8.5c0-.9.3-1.6 1.6-1.6H17V4.1c-.4-.1-1.4-.1-2.4-.1-2.4 0-4 1.4-4 4.1v2.5H8v3.2h2.6V22h2.9Z"/>
        </svg>
      </a>

      <a class="social-icon" href="https://www.x.com/derekduzan" aria-label="X" title="X">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.9 3H21l-4.6 5.2L22 21h-4.4l-3.5-4.8L9.8 21H7.7l5-5.7L2 3h4.5l3.1 4.3L13.4 3h5.5Zm-1.5 16h1.2L7.2 4.9H6l11.4 14.1Z"/>
        </svg>
      </a>
    </div>

    <p class="footer">www.derekduzan.com</p>
  </main>

  <script>
    const contactBox = document.querySelector('.contact-box');
    const contactToggle = document.querySelector('.contact-toggle');
    const contactFields = document.querySelector('#contactFields');
    const firstNameInput = document.querySelector('#firstName');

    contactToggle.addEventListener('click', () => {
      const isOpen = contactToggle.getAttribute('aria-expanded') === 'true';

      contactToggle.setAttribute('aria-expanded', String(!isOpen));
      contactFields.hidden = isOpen;
      contactBox.classList.toggle('open', !isOpen);

      if (!isOpen) {
        setTimeout(() => {
          firstNameInput.focus();
        }, 100);
      }
    });
  </script>
</body>
</html>
