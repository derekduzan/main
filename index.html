.card {
  width: min(100%, 324px);
  padding: 24px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, .24);
  border-radius: 26px;
  background: var(--card);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  box-shadow: 0 22px 64px rgba(0, 0, 0, .30);
}
.logo {
  width: 104px;
  height: 104px;
  display: block;
  margin: 0 auto 16px;
  object-fit: cover;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .5);
  box-shadow: 0 12px 28px rgba(0, 0, 0, .28);
}
h1 {
  margin: 0;
  font-size: 1.5rem;
  line-height: 1.1;
  letter-spacing: -.03em;
  font-weight: 750;
}
.handle {
  margin: 7px 0 6px;
  color: var(--muted);
  font-size: .94rem;
}
.subtitle {
  margin: 0 0 18px;
  color: var(--muted-soft);
  font-size: .82rem;
  letter-spacing: .04em;
}
.btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--button);
  color: var(--text);
  text-decoration: none;
  font-weight: 620;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.btn:hover {
  transform: translateY(-1px);
  background: var(--button-hover);
  border-color: rgba(255, 255, 255, .34);
}
.btn:focus-visible, .social-icon:focus-visible {
  outline: 3px solid rgba(255, 255, 255, .55);
  outline-offset: 3px;
}
.social-row {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
}
.social-icon {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--button);
  color: var(--text);
  text-decoration: none;
  transition: transform .18s ease, background .18s ease;
}
.social-icon:hover { transform: translateY(-1px); background: var(--button-hover); }
.social-icon svg { width: 18px; height: 18px; fill: currentColor; }
@media (max-width: 420px) {
  body { padding: 16px; background-attachment: scroll; }
  .card { padding: 22px; }
}

.footer {
  margin: 17px 0 0;
  color: var(--muted-soft);
  font-size: .72rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}
@media (max-width: 480px) {
  .card {
    width: min(100%, 340px);
    padding: 24px 20px;
    border-radius: 24px;
  }
  .logo {
    width: 96px;
    height: 96px;
    margin-bottom: 14px;
  }
  h1 { font-size: 1.42rem; }
  .handle { font-size: .9rem; }
  .subtitle { font-size: .78rem; margin-bottom: 16px; }
  .btn { padding: 10px 13px; font-size: .95rem; }
  .social-icon { width: 38px; height: 38px; }
}
</style>
